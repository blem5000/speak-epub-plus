[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.importlinter]
root_packages = ["core", "adapters"]

[tool.importlinter.contracts.core-no-adapters]
# Exception documented in .importlinter: core.config uses importlib dynamic import for search — keeps GUI→Core→Port→Adapter.
name = "Core must not depend on adapters (AD-1) — exception: core.config dynamic import (see core/config.py)"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["adapters"]

[tool.importlinter.contracts.adapters-no-pipeline]
name = "Adapters must not depend on core pipeline (AD-1)"
type = "forbidden"
source_modules = ["adapters"]
forbidden_modules = [
    "core.fetch",
    "core.clean",
    "core.epub",
    "core.tts",
    "core.merge",
    "core.aggregator",
    "core.pipeline",
    "core.config",
]
