name: release

# Builds the Windows desktop app on a tag push (e.g. v0.1.0) and publishes
# the exe + installers as a GitHub Release.
# GitHub-hosted Windows runners include the MSVC toolchain, so `link.exe`
# is available here even when the developer machine lacks VS Build Tools.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build the Python tiers
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/sidecar-runtime'
          New-Item -ItemType Directory -Force -Path $runtime | Out-Null

          # The interpreter build is PINNED: the runtime cache key is derived
          # from it, so a floating "latest" would re-download the runtime on
          # every release (exactly what the tier split avoids).
          $pythonTag = '20261013'
          $pythonVersion = '3.11.17+20261013'
          $assetName = "cpython-$pythonVersion-x86_64-pc-windows-msvc-install_only.tar.gz"
          $url = "https://github.com/astral-sh/python-build-standalone/releases/download/$pythonTag/$assetName"
          Write-Host "Downloading $assetName"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\python.tar.gz" -UseBasicParsing
          tar -xzf "$env:TEMP\python.tar.gz" -C $runtime
          $py = Join-Path $runtime 'python/python.exe'
          if (-not (Test-Path $py)) { throw 'Embedded python not found after extraction' }

          # Split the requirements into the two tiers (core = bundled with the
          # app, local = the optional Piper engine). One source of truth:
          # requirements.txt with the # core / # local markers.
          $reqDir = Join-Path $env:GITHUB_WORKSPACE 'build/requirements'
          $desc = Join-Path $runtime 'runtime.json'
          & $py 'scripts/runtime_descriptor.py' --python-version $pythonVersion --requirements 'requirements.txt' --out $desc --split-out-dir $reqDir --release-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          $coreReq = Join-Path $reqDir 'requirements-core.txt'
          $localReq = Join-Path $reqDir 'requirements-local.txt'
          $descriptor = Get-Content $desc -Raw | ConvertFrom-Json
          Write-Host "core requirements: $coreReq / local requirements: $localReq"
          Write-Host "Runtime hash: $($descriptor.hash) / local hash: $($descriptor.local_hash)"

          & $py -m pip install --disable-pip-version-check --quiet --upgrade pip
          & $py -m pip install --disable-pip-version-check --quiet -r $coreReq

          # Copy the Python core so `from core.config import handle_rpc` resolves from cwd.
          $code = Join-Path $runtime 'code'
          New-Item -ItemType Directory -Force -Path $code | Out-Null
          Copy-Item 'core' $code -Recurse
          Copy-Item 'adapters' $code -Recurse
          Copy-Item 'speak.py' $code

          # Sanity check: ping through handle_rpc with the bundled runtime.
          $ping = & $py -c "import sys; sys.path.insert(0, r'$code'); from core.config import handle_rpc; print(handle_rpc({'id':'1','method':'ping'}))"
          Write-Host "Sidecar ping: $ping"

          # ---- the optional local-engine tier -------------------------------
          # It is installed into a separate folder and shipped as its own
          # asset: users who stay on Edge TTS never download it. This must
          # happen BEFORE the runtime is trimmed (pip is removed there).
          $extras = Join-Path $env:GITHUB_WORKSPACE 'build/local-engine'
          Remove-Item $extras -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extras | Out-Null
          $ErrorActionPreference = 'Continue'
          & $py -m pip install --disable-pip-version-check --quiet --target $extras -r $localReq
          $pipExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($pipExit -ne 0) { throw "pip install (local engine) failed ($pipExit)" }
          # The packages must be importable from the target folder alone.
          $imp = & $py -c "import sys; sys.path.insert(0, r'$extras'); import piper, onnxruntime, numpy; print('ok')" 2>&1
          if ($LASTEXITCODE -ne 0 -or ($imp -join "`n") -ne 'ok') {
            throw "the local engine does not import: $imp"
          }
          Get-ChildItem $extras -Recurse -Directory -Filter '__pycache__' | ForEach-Object {
            Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }
          $localZipBase = Join-Path $env:GITHUB_WORKSPACE ([System.IO.Path]::GetFileNameWithoutExtension($descriptor.local_asset))
          & $py -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2], base_dir='.')" $localZipBase $extras
          if (-not (Test-Path "$localZipBase.zip")) { throw "local engine archive missing" }
          Write-Host "Local engine asset: $localZipBase.zip ($([math]::Round((Get-Item "$localZipBase.zip").Length/1MB,1)) MB)"

      - name: Trim and package the runtime tier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/sidecar-runtime'
          $py = Join-Path $runtime 'python/python.exe'
          $desc = Get-Content (Join-Path $runtime 'runtime.json') -Raw | ConvertFrom-Json

          # Trim the runtime: pip/setuptools/ensurepip are dead weight once
          # the dependencies are installed (-64 MB), the stdlib test/junk
          # folders are never used at runtime.
          # NOTE: distutils-precedence.pth belongs to setuptools — leaving it
          # behind makes EVERY interpreter start fail (it imports the removed
          # _distutils_hack), so it goes with the package.
          $pyDir = Join-Path $runtime 'python'
          foreach ($junk in @(
              'Lib/site-packages/pip', 'Lib/site-packages/pip-',
              'Lib/site-packages/setuptools', 'Lib/site-packages/_distutils_hack',
              'Lib/site-packages/distutils-precedence.pth',
              'Lib/site-packages/distutils', 'Lib/ensurepip', 'Lib/test',
              'Lib/idlelib', 'Lib/lib2to3', 'Lib/tkinter', 'Lib/turtledemo',
              'Scripts/pip.exe', 'Scripts/pip3.exe', 'Scripts/pip3.11.exe')) {
            $p = Join-Path $pyDir $junk
            if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Get-ChildItem $pyDir -Recurse -Directory -Filter '__pycache__' | ForEach-Object {
            Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Gate: the trimmed interpreter must still start cleanly and answer
          # a ping through our backend (a leftover .pth breaks every start).
          $trimProbe = & $py -c "import sys; print('ok')" 2>&1
          if ($LASTEXITCODE -ne 0 -or ($trimProbe -join "`n") -ne 'ok') {
            throw "the trimmed runtime does not start: $trimProbe"
          }
          # Gate: the runtime must NOT contain the local engine (Piper +
          # numpy + onnxruntime) — that is a separate optional download.
          & $py -c "import importlib.util, sys; sys.exit(1 if importlib.util.find_spec('piper') else 0)"
          if ($LASTEXITCODE -ne 0) { throw 'the runtime still contains piper — the tiers are not split' }

          # Package the runtime tier (forward slashes — PowerShell's
          # Compress-Archive writes backslashes, which non-Windows unzip
          # treats as part of the file name -> the app would not find
          # <cache>/<hash>/python/python.exe there).
          $zipBase = Join-Path $env:GITHUB_WORKSPACE ([System.IO.Path]::GetFileNameWithoutExtension($desc.asset))
          & $py -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', root_dir=sys.argv[2], base_dir='python')" $zipBase $runtime
          $zip = "$zipBase.zip"
          if (-not (Test-Path $zip)) { throw "runtime archive missing: $zip" }
          Write-Host "Runtime asset: $zip ($([math]::Round((Get-Item $zip).Length/1MB,1)) MB)"
          # The app tier must NOT carry the interpreter: it is downloaded once
          # and cached. Keep only our code + the descriptor.
          Remove-Item (Join-Path $runtime 'python') -Recurse -Force
          Get-ChildItem $runtime | ForEach-Object { Write-Host "app tier keeps: $($_.Name)" }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Speak EPUB ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Speak EPUB ${{ github.ref_name }}

            Desktop app for Windows (Tauri + React GUI driving the Python core: EPUB build, Edge TTS, M4B with chapter markers).

            ### Assets
            - **`Speak.EPUB_<version>_x64-setup.exe`** — NSIS installer
            - **`Speak.EPUB_<version>_x64_en-US.msi`** — MSI installer
            - **`Speak-EPUB-<version>-x64-portable.zip`** — portable build: unzip anywhere and run `speak-epub.exe`
            - **`speak-epub-runtime-<hash>.zip`** — the Python runtime tier (downloaded once and cached, see below)
            - **`speak-epub-local-<hash>.zip`** — the optional local TTS engine (Piper + ONNX), only needed for offline synthesis
            - Source code archive (auto-added by GitHub)

            ### Two tiers: the app updates without re-downloading Python
            The installers and the portable ZIP contain the **app tier** (~15 MB: the
            executable + the Python `core`/`adapters` code). The **runtime tier** (the
            embedded CPython interpreter and its dependencies) is published as a
            separate asset and downloaded **once** on the first launch, then cached in
            the user profile (`%LOCALAPPDATA%\speak-epub\runtime\<hash>`).

            The cache key is derived from the interpreter build and `requirements.txt`,
            so an app update re-downloads the runtime only when the dependencies
            actually changed — every other update transfers just the app tier.

            ### Requirements for full functionality
            - **FFmpeg** — downloaded automatically on first use (or install it yourself: `winget install ffmpeg`)
            - Internet access for Edge TTS, novel-site fetching and the first runtime download

      - name: Build portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'src-tauri/target/release'
          if (-not (Test-Path "$rel/speak-epub.exe")) { throw 'speak-epub.exe not found in target/release' }
          $portable = 'portable/Speak-EPUB'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item "$rel/speak-epub.exe" $portable
          if (Test-Path "$rel/sidecar-runtime") {
            Copy-Item "$rel/sidecar-runtime" $portable -Recurse
          } elseif (Test-Path 'src-tauri/sidecar-runtime') {
            Copy-Item 'src-tauri/sidecar-runtime' $portable -Recurse
          } else {
            throw 'sidecar-runtime not found for portable build'
          }
          $zip = "portable/Speak-EPUB-$($env:GITHUB_REF_NAME)-x64-portable.zip"
          Compress-Archive -Path "$portable/*" -DestinationPath $zip -Force
          Write-Host "Portable zip created: $zip"

      - name: Upload portable zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "portable/Speak-EPUB-$($env:GITHUB_REF_NAME)-x64-portable.zip" --clobber --repo ${{ github.repository }}

      - name: Upload the tier assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/sidecar-runtime'
          $desc = Get-Content (Join-Path $runtime 'runtime.json') -Raw | ConvertFrom-Json
          $assets = @(
            (Join-Path $env:GITHUB_WORKSPACE $desc.asset),
            (Join-Path $env:GITHUB_WORKSPACE $desc.local_asset)
          )
          foreach ($zip in $assets) {
            if (-not (Test-Path $zip)) { throw "tier asset missing: $zip" }
            gh release upload ${{ github.ref_name }} $zip --clobber --repo ${{ github.repository }}
            Write-Host "Uploaded $(Split-Path $zip -Leaf)"
          }