[package]
name = "speak-epub"
version = "0.3.18"
description = "Speak EPUB — EPUB to audiobook via Edge TTS"
authors = ["Speak EPUB"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "speak_epub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-store = "2.4.4"
tauri-plugin-opener = "2.5.2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = "0.12"
tauri-plugin-updater = "2.12.0"
